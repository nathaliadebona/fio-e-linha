<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico - Fio &amp; Linha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/historico.css">
</head>

<body data-pagina="historico">
    <main>
        <h1>Histórico</h1>

        <div class="barra-filtros">
            <div class="campo">
                <label for="filtro-dia">Dia</label>
                <input type="date" name="filtro-dia" id="filtro-dia">
            </div>

            <div class="campo">
                <label for="filtro-categoria">Categoria</label>
                <select name="filtro-categoria" id="filtro-categoria">
                    <option value="">Todas as categorias</option>
                    <option value="blusa">Blusa</option>
                    <option value="vestido">Vestido</option>
                    <option value="calca">Calça</option>
                    <option value="acessorio">Acessório</option>
                </select>
            </div>

            <button type="button" id="limpar-filtro" class="btn-secundario">Limpar filtro</button>
        </div>

        <p id="devolucao-sucesso" role="status" hidden>Produto devolvido ao estoque</p>

        <ul id="vendas"></ul>
    </main>

    <div id="barra-devolucao" hidden>
        <p>Selecionados: <span id="devolucao-contagem">0</span></p>

        <button type="button" id="devolver-btn" class="btn-primario">Devolver ao estoque</button>
    </div>

    <dialog id="modal-devolucao" aria-labelledby="titulo-devolucao">
        <h2 id="titulo-devolucao">Devolver ao estoque</h2>

        <form action="" id="form-devolucao">
            <ul id="lista-devolucao"></ul>

            <p id="devolucao-erro" role="alert" hidden></p>

            <div class="acoes-modal">
                <button type="button" id="cancelar-devolucao" class="btn-secundario">Cancelar</button>
                <button type="submit" class="btn-primario">Confirmar</button>
            </div>
        </form>
    </dialog>

    <script src="js/global.js"></script>
    <script src="js/historico.js"></script>
</body>
</html>
