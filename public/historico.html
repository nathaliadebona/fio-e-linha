<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico - Fio &amp; Linha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/historico.css">
</head>

<body>
    <nav>
        <ul>
            <li><a href="estoque.html"><i class="fa-solid fa-boxes-stacked" aria-hidden="true"></i> Estoque</a></li>
            <li><a href="baixa.html"><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i> Baixa</a></li>
            <li><a href="historico.html" aria-current="page"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i> Histórico</a></li>
            <li><button type="button" id="sair-btn"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Sair</button></li>
        </ul>
    </nav>

    <main>
        <h1>Histórico</h1>

        <ul id="vendas"></ul>
    </main>

    <div id="barra-devolucao" hidden>
        <p>Selecionados: <span id="devolucao-contagem">0</span></p>

        <button type="button" id="devolver-btn" class="btn-primario">Devolver ao estoque</button>
    </div>

    <dialog id="modal-devolucao">
        <ul id="lista-devolucao"></ul>

        <p id="devolucao-erro" role="alert" hidden></p>

        <div class="acoes-modal">
            <button type="button" id="confirmar-devolucao" class="btn-primario">Confirmar</button>
            <button type="button" id="cancelar-devolucao" class="btn-secundario">Cancelar</button>
        </div>
    </dialog>

    <script src="js/global.js"></script>
    <script src="js/historico.js"></script>
</body>
</html>
