<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baixa - Fio &amp; Linha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/baixa.css">
</head>

<body>
    <nav>
        <ul>
            <li><a href="estoque.html"><i class="fa-solid fa-boxes-stacked" aria-hidden="true"></i> Estoque</a></li>
            <li><a href="baixa.html" aria-current="page"><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i> Baixa</a></li>
            <li><a href="historico.html"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i> Histórico</a></li>
            <li><button type="button" id="sair-btn"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Sair</button></li>
        </ul>
    </nav>

    <main>
        <h1>Baixa</h1>

        <div class="barra-busca">
            <div class="campo-busca">
                <input type="search" id="busca" placeholder="Buscar por nome ou código" aria-label="Buscar peças">
                <button type="button" id="busca-btn" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>
            </div>

            <select name="filtro-categoria" id="filtro-categoria" aria-label="Filtrar por categoria">
                <option value="">Todas as categorias</option>
                <option value="blusa">Blusa</option>
                <option value="vestido">Vestido</option>
                <option value="calca">Calça</option>
                <option value="acessorio">Acessório</option>
            </select>
        </div>

        <ul id="resultados"></ul>

        <aside id="checkout">
            <h2>Checkout</h2>

            <ul id="checkout-lista"></ul>

            <div class="resumo">
                <p>Itens: <span id="checkout-itens">0</span></p>
                <p>Total: <span id="checkout-total">R$ 0,00</span></p>
            </div>

            <p id="checkout-erro" role="alert" hidden>Selecione pelo menos um produto para dar baixa</p>

            <p id="checkout-sucesso" role="status" hidden>Baixa efetuada com sucesso</p>

            <p id="checkout-falha" role="alert" hidden>Não foi possível dar baixa: o estoque mudou. Confira as quantidades e tente de novo.</p>

            <button type="button" id="dar-baixa-btn" class="btn-primario">Dar baixa</button>
        </aside>

        <a href="#checkout" id="ir-checkout" class="btn-flutuante" aria-label="Ir para o checkout">
            <i class="fa-solid fa-basket-shopping" aria-hidden="true"></i>
            <span id="checkout-contador">0</span>
        </a>
    </main>

    <dialog id="modal-item" aria-labelledby="item-titulo">
        <h2 id="item-titulo"></h2>

        <form action="" id="form-item">
            <div class="campo">
                <label for="item-tamanho">Tamanho</label>
                <select name="item-tamanho" id="item-tamanho" required></select>
            </div>

            <div class="campo">
                <label for="item-quantidade">Quantidade</label>
                <input type="number" name="item-quantidade" id="item-quantidade" min="1" required>
            </div>

            <p id="item-erro" role="alert" hidden></p>

            <div class="acoes-modal">
                <button type="button" id="cancelar-item" class="btn-secundario">Cancelar</button>
                <button type="submit" class="btn-primario">Adicionar</button>
            </div>
        </form>
    </dialog>

    <script src="js/global.js"></script>
    <script src="js/baixa.js"></script>
</body>
</html>
