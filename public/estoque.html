<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estoque - Fio &amp; Linha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/estoque.css">
</head>

<body>
    <nav>
        <ul>
            <li><a href="estoque.html" aria-current="page"><i class="fa-solid fa-boxes-stacked" aria-hidden="true"></i> Estoque</a></li>
            <li><a href="baixa.html"><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i> Baixa</a></li>
            <li><a href="historico.html"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i> Histórico</a></li>
            <li><button type="button" id="sair-btn"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Sair</button></li>
        </ul>
    </nav>

    <main>
        <h1>Estoque</h1>

        <div class="alerta-estoque">
            <p>Você tem produtos com baixa quantidade em estoque</p>
            <a href="#lista-pecas">Ver peças</a>
        </div>

        <div class="barra-busca">
            <div class="campo-busca">
                <input type="search" id="busca" placeholder="Buscar por nome ou código" aria-label="Buscar peças">
                <button type="button" id="busca-btn" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>
            </div>

            <select name="filtro-categoria" id="filtro-categoria" aria-label="Filtrar por categoria">
                <option value="">Todas as categorias</option>
                <option value="blusa">Blusa</option>
                <option value="vestido">Vestido</option>
                <option value="calca">Calça</option>
                <option value="acessorio">Acessório</option>
            </select>

            <button type="button" id="nova-peca-btn" class="btn-primario"><i class="fa-solid fa-plus" aria-hidden="true"></i> Nova peça</button>
        </div>

        <ul id="lista-pecas"></ul>
    </main>

    <dialog id="modal-peca" aria-labelledby="titulo-peca">
        <h2 id="titulo-peca">Nova peça</h2>
    
        <form action="" id="form-peca">
            <div class="campo">
                <label for="categoria">Categoria</label>
                <select name="categoria" id="categoria" required>
                    <option value="">Escolha uma categoria</option>
                    <option value="blusa">Blusa</option>
                    <option value="vestido">Vestido</option>
                    <option value="calca">Calça</option>
                    <option value="acessorio">Acessório</option>
                </select>
            </div>

            <fieldset id="campo-tamanhos">
                <legend>Tamanhos</legend>
                <div id="lista-tamanhos"></div>
                <p id="erro-tamanhos" role="alert" hidden>Marque pelo menos um tamanho</p>
            </fieldset>

            <div class="campo">
                <label for="nome">Nome da peça</label>
                <input type="text" name="nome" id="nome" required>
            </div>

            <div class="campo">
                <label for="cor">Cor</label>
                <input type="text" name="cor" id="cor" required>
            </div>

            <div class="campo">
                <label for="codigo">Código</label>
                <input type="text" name="codigo" id="codigo" required>
            </div>

            <div class="campo">
                <label for="custo">Preço de custo</label>
                <input type="number" name="custo" id="custo" min="0" step="0.01" required>
            </div>

            <div class="campo">
                <label for="venda">Valor de venda</label>
                <input type="number" name="venda" id="venda" min="0" step="0.01" required>
            </div>

            <div class="campo">
                <label for="fornecedor">Fornecedor</label>
                <input type="text" name="fornecedor" id="fornecedor" required>
            </div>

            <div class="campo">
                <label for="data-chegada">Data de chegada</label>
                <input type="date" name="data-chegada" id="data-chegada" required>
            </div>

            <button type="submit" class="btn-primario">Salvar peça</button>

            <button type="button" id="fechar-modal" aria-label="Fechar"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </form>
    </dialog>

    <dialog id="modal-detalhes" aria-labelledby="detalhes-titulo">
        <h2 id="detalhes-titulo"></h2>

        <dl>
            <dt>Cor</dt>
            <dd id="detalhe-cor"></dd>

            <dt>Preço de custo</dt>
            <dd id="detalhe-custo"></dd>

            <dt>Fornecedor</dt>
            <dd id="detalhe-fornecedor"></dd>

            <dt>Data de chegada</dt>
            <dd id="detalhe-data"></dd>
        </dl>

        <button type="button" id="fechar-detalhes" aria-label="Fechar"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </dialog>

    <dialog id="modal-excluir" role="alertdialog" aria-labelledby="titulo-excluir">
        <h2 id="titulo-excluir">Excluir peça?</h2>
        <p id="excluir-texto"></p>

        <div class="acoes-modal">
            <button type="button" id="cancelar-excluir" class="btn-secundario">Cancelar</button>
            <button type="button" id="confirmar-excluir" class="btn-primario">Excluir</button>
        </div>
    </dialog>

    <dialog id="modal-baixo" aria-labelledby="titulo-baixo">
        <h2 id="titulo-baixo">Estoque baixo</h2>

        <ul id="lista-baixo"></ul>

        <button type="button" id="fechar-baixo" aria-label="Fechar"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </dialog>

    <script src="js/global.js"></script>
    <script src="js/estoque.js"></script>
</body>
</html>
